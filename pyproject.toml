[project]
name = "tessellatum"
version = "1.0.0"
description = "Turn any picture into a printable paint-by-numbers page, with computer vision and on-device neural networks."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Maxim Shilo" }]
keywords = [
    "paint-by-numbers", "computer-vision", "image-processing", "image-segmentation", "color-quantization",
    "face-detection", "text-detection", "saliency", "opencv", "onnxruntime", "numba", "pyside6",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "PySide6>=6.6",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "Pillow>=10.2",
    "numba>=0.61",
    # Runs the bundled text detection network (core/text.py). From 1.20: 1.30 needs Python 3.11, and 3.10 is supported.
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.4",
    # OCR for the benchmark's text metrics. rapidocr ships its models in the wheel and runs offline, on onnxruntime (a
    # dependency of the app itself); it is pinned because those models are the yardstick.
    "rapidocr==3.9.2",
]

[project.scripts]
tessellatum = "tessellatum.main:main"

[project.urls]
Homepage = "https://github.com/maximshilo/tessellatum"
Documentation = "https://github.com/maximshilo/tessellatum/wiki"
Changelog = "https://github.com/maximshilo/tessellatum/blob/main/CHANGELOG.md"
Issues = "https://github.com/maximshilo/tessellatum/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tessellatum = ["resources/*"]
