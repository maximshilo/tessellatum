[project]
name = "tessellatum"
version = "0.1.0"
description = "Generate paint-by-numbers style coloring pages from any image."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "Pillow>=10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.4",
]

[project.scripts]
tessellatum = "tessellatum.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tessellatum = ["resources/*"]
