name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.name }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # one platform's failure shouldn't hide the others' results
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-latest }
          - { name: macOS, os: macos-latest }
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen  # the GUI tests drive real widgets without a display
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt's system libraries
        # PySide6's wheels bring Qt but not the libraries it loads from the system, even offscreen.
        # A stalled package mirror once hung apt-get for the whole job's hour: time it out and retry instead.
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests/ -q
