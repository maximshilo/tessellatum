name: layout

# The window drawn on each platform's own display system (not Qt's offscreen one, which has no fonts): Windows, macOS
# (Cocoa) and Linux (X11, under Xvfb). docs/check_layout.py renders the window, the export dialog and the Preferences
# at window sizes and interface scales, in English and the pseudo-locale, and reports text that doesn't fit; its
# screenshots and report are the run's artifact.

on:
  pull_request:
    paths:
      - "src/tessellatum/gui/**"
      - "docs/check_layout.py"
      - ".github/workflows/layout.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    name: layout (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-latest }
          - { name: macOS, os: macos-latest }
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt's system libraries and Xvfb
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt_opts update
          sudo apt-get $apt_opts install -y --no-install-recommends xvfb libegl1 libgl1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Layout, English
        shell: bash
        run: |
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 3840x2160x24" "$@"; else "$@"; fi; }
          run python docs/check_layout.py layout/english --scales 1 1.25 1.5 2 --sizes 1280x720 1920x1080 2560x1440

      - name: Layout, pseudo-locale
        if: always()
        shell: bash
        run: |
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 3840x2160x24" "$@"; else "$@"; fi; }
          run python docs/check_layout.py layout/pseudo --pseudo --scales 1 --sizes 1280x720 --themes light

      - name: Report
        if: always()
        shell: bash
        run: cat layout/english/layout.md layout/pseudo/layout.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-${{ matrix.name }}
          path: layout/
          retention-days: 14
