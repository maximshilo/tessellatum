name: wiki

# Publishes wiki/ to the repository's GitHub wiki, so the wiki changes with the code it describes. Edit the pages in
# wiki/; edits made in GitHub's wiki editor are overwritten by the next publish.

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish wiki/ to the GitHub wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" published; then
            echo "::error::The wiki repository doesn't exist yet. Create any first page in the repository's Wiki tab once, then run this workflow again."
            exit 1
          fi
          rsync -a --delete --exclude .git wiki/ published/
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git commit -m "Publish wiki from ${GITHUB_SHA::7}"
          git push
