name: release

# A pushed tag vX.Y.Z builds the standalone Windows app and publishes it as a GitHub release, with that version's
# CHANGELOG.md section as its notes. Pull requests that touch the packaging only build it, to check that it still does.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Read the version
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          "VERSION=$version" >> $env:GITHUB_ENV
          "ZIP=Tessellatum-$version-windows-x64.zip" >> $env:GITHUB_ENV

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ("v$env:VERSION" -ne "$env:GITHUB_REF_NAME") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match the version in pyproject.toml ($env:VERSION)"
          }

      - name: Install
        run: python -m pip install -e . pyinstaller

      - name: Build the standalone app
        # The same PyInstaller call as packaging/build_windows.ps1, in this job's Python.
        run: pyinstaller --noconfirm --clean --workpath build\_pyinstaller_scratch --distpath dist packaging\tessellatum.spec

      - name: Check the build
        run: |
          if (-not (Test-Path dist\Tessellatum\Tessellatum.exe)) { throw "dist\Tessellatum\Tessellatum.exe is missing" }
          $models = Get-ChildItem -Recurse dist\Tessellatum -Include *.onnx, lbpcascade_animeface.xml
          if ($models.Count -lt 4) { throw "the bundled models are missing from the build" }
          "{0:N0} MB in dist\Tessellatum" -f ((Get-ChildItem -Recurse dist\Tessellatum | Measure-Object Length -Sum).Sum / 1MB)

      - name: Zip
        run: 7z a -tzip -mx=7 "$env:ZIP" .\dist\Tessellatum

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}
          retention-days: 7

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python packaging/release_notes.py $env:VERSION | Out-File -Encoding utf8 notes.md
          gh release create "$env:GITHUB_REF_NAME" "$env:ZIP" --title "Tessellatum $env:VERSION" --notes-file notes.md --verify-tag
